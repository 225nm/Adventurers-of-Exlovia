<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Adventurers of Exlovia</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <script type="module" src="src/start.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
      #content {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      /* the game's fonts, loaded by BootScene before the title (SIL OFL, see assets/CREDITS.md) */
      @font-face {
        font-family: 'Nunito';
        src: url('assets/fonts/Nunito.woff2') format('woff2');
        font-weight: 200 1000;
      }
      @font-face {
        font-family: 'Cinzel';
        src: url('assets/fonts/Cinzel.woff2') format('woff2');
        font-weight: 400 900;
      }
    </style>
  </head>
  <body>
    <div
      id="content"
      style="
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      "
    ></div>
  </body>
</html>
