<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Adventurers of Exlovia</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <script type="module" src="src/start.js"></script>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-pixelated;
        image-rendering: -moz-crisp-edges;
      }
      #content {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
      @font-face {
        font-family: 'Press Start 2P';
        src: url('assets/PressStart2P-Regular.ttf') format('truetype');
      }
    </style>
  </head>
  <body>
    <div
      id="content"
      style="
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      "
    ></div>
    <!-- Hidden div to make the font load before title screen-->
    <div style="font-family: 'Press Start 2P'; visibility: hidden; position: absolute;">.</div>
  </body>
</html>
