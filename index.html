<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Adventurers of Exlovia</title>
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,user-scalable=no"
    />
    <script type="module" src="src/start.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        overflow: hidden;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        image-rendering: -moz-pixelated;
        image-rendering: -moz-crisp-edges;
      }
      #content {
        display: flex;
        width: 100%;
        height: 100%;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div
      id="content"
      style="
        display: flex;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      "
    ></div>
  </body>
</html>
