<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 104">
  <!-- Title mage, anime JRPG style, facing the viewer: long golden hair, big eyes, wide witch hat, blue robe, orb staff.
       Drawn at 2 units per pixel and cel shaded, the eyes are placed pixel by pixel at the end -->
  <defs>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#8a9af8"/><stop offset="0.3" stop-color="#4a5ae0"/><stop offset="0.62" stop-color="#4a5ae0"/><stop offset="0.62" stop-color="#2e38a8"/><stop offset="0.86" stop-color="#2e38a8"/><stop offset="0.86" stop-color="#1c2270"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#ffffff"/><stop offset="0.3" stop-color="#f4f6ff"/><stop offset="0.62" stop-color="#f4f6ff"/><stop offset="0.62" stop-color="#c8d0f0"/><stop offset="0.86" stop-color="#c8d0f0"/><stop offset="0.86" stop-color="#9aa4d0"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#aa8af2"/><stop offset="0.3" stop-color="#6a46c8"/><stop offset="0.62" stop-color="#6a46c8"/><stop offset="0.62" stop-color="#4a2c96"/><stop offset="0.86" stop-color="#4a2c96"/><stop offset="0.86" stop-color="#2e1a6a"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#ffece0"/><stop offset="0.3" stop-color="#ffecdc"/><stop offset="0.62" stop-color="#ffecdc"/><stop offset="0.62" stop-color="#f8c8a8"/><stop offset="0.86" stop-color="#f8c8a8"/><stop offset="0.86" stop-color="#e09a80"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#fff6c0"/><stop offset="0.3" stop-color="#ffd860"/><stop offset="0.62" stop-color="#ffd860"/><stop offset="0.62" stop-color="#d8a838"/><stop offset="0.86" stop-color="#d8a838"/><stop offset="0.86" stop-color="#a87a20"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#fff6c0"/><stop offset="0.3" stop-color="#f0c040"/><stop offset="0.62" stop-color="#f0c040"/><stop offset="0.62" stop-color="#c08a20"/><stop offset="0.86" stop-color="#c08a20"/><stop offset="0.86" stop-color="#8a5a10"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#d0a060"/><stop offset="0.5" stop-color="#7a4a24"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#f0feff"/><stop offset="0.3" stop-color="#9ae4ff"/><stop offset="0.62" stop-color="#9ae4ff"/><stop offset="0.62" stop-color="#3aa8ec"/><stop offset="0.86" stop-color="#3aa8ec"/><stop offset="0.86" stop-color="#1a5ab0"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#d09a60"/><stop offset="0.3" stop-color="#9a6030"/><stop offset="0.62" stop-color="#9a6030"/><stop offset="0.62" stop-color="#643a18"/><stop offset="0.86" stop-color="#643a18"/><stop offset="0.86" stop-color="#40240e"/></linearGradient>
  </defs>
  <g transform="scale(0.5)">
  <g stroke="#2a1a30" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- long hair falling behind the body -->
    <path d="M28 30 C18 62 18 100 24 122 L40 114 L54 120 L68 114 L84 122 C90 100 90 62 80 30 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <!-- staff -->
    <path d="M90 30 L88 204" stroke="url(#wood)" stroke-width="5"/>
    <circle cx="90" cy="22" r="9" fill="none" stroke="url(#gold)" stroke-width="3.4"/>
    <circle cx="90" cy="22" r="6" fill="url(#orb)" stroke="#1a3a80"/>
    <!-- boots, robe, white hem, collar, sash -->
    <path d="M38 196 L50 196 L50 204 L36 204 Z M58 196 L70 196 L72 204 L58 204 Z" fill="url(#leather)" stroke="#2e1808"/>
    <path d="M38 58 C38 52 70 52 70 58 L74 100 C80 140 86 174 90 198 L18 198 C22 174 28 140 34 100 Z" fill="url(#robe)" stroke="#121a5a"/>
    <path d="M20.5 188 C40 192 68 192 87.5 188 L90 198 L18 198 Z" fill="url(#white)" stroke="#5a6aa8"/>
    <path d="M42 54 L54 72 L66 54 L62 52 L54 62 L46 52 Z" fill="url(#white)" stroke="#5a6aa8"/>
    <path d="M35 92 C44 96 64 96 73 92 L73.5 100 C64 104 44 104 34.5 100 Z" fill="url(#gold)" stroke="#6a4008"/>
    <!-- sleeves: one hand at the chest, one on the staff -->
    <path d="M38 60 C28 66 24 80 26 96 L36 98 C36 84 40 76 46 72 Z" fill="url(#robe)" stroke="#121a5a"/>
    <path d="M70 60 C80 64 86 72 86 84 L86 92 L76 94 C76 84 74 76 66 72 Z" fill="url(#robe)" stroke="#121a5a"/>
    <ellipse cx="31" cy="99" rx="5" ry="4" fill="url(#skin)" stroke="#9a4a3a"/>
    <ellipse cx="87" cy="92" rx="4.6" ry="4.2" fill="url(#skin)" stroke="#9a4a3a"/>
    <!-- neck, big face, locks of hair framing it -->
    <path d="M47 46 L61 46 L61 56 L47 56 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <path d="M32 26 C32 8 76 8 76 26 C76 40 66 50 54 52 C42 50 32 40 32 26 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <path d="M32 24 C27 40 27 58 30 74 L37 70 C35 56 35 42 37 30 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <path d="M76 24 C81 40 81 58 78 74 L71 70 C73 56 73 42 71 30 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <path d="M31 31 C29 18 42 14 54 14 C66 14 79 18 77 31 L73 24 C69 29 62 29 58 23 C56 29 50 29 48 23 C44 29 38 29 35 24 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <!-- witch hat: brim, bent cone, gold band -->
    <path d="M10 17 C22 8 86 8 98 17 C86 24 22 24 10 17 Z" fill="url(#hat)" stroke="#22105a"/>
    <path d="M34 15 C36 6 44 2 54 0 C50 4 60 4 64 1 C66 6 70 11 74 15 Z" fill="url(#hat)" stroke="#22105a"/>
    <path d="M34.5 11.5 C44 14.5 64 14.5 73.5 11.5 L74 15.5 C64 18.5 44 18.5 34 15.5 Z" fill="url(#gold)" stroke="#6a4008"/>
  </g>
  </g>
  <!-- eyes with lashes, blush and mouth placed pixel by pixel -->
  <g>
    <rect x="18" y="15" width="6" height="1" fill="#1e1430"/>
    <rect x="30" y="15" width="6" height="1" fill="#1e1430"/>
    <rect x="18" y="14" width="1" height="1" fill="#1e1430"/>
    <rect x="35" y="14" width="1" height="1" fill="#1e1430"/>
    <rect x="19" y="16" width="1" height="3" fill="#ffffff"/>
    <rect x="23" y="16" width="1" height="3" fill="#ffffff"/>
    <rect x="30" y="16" width="1" height="3" fill="#ffffff"/>
    <rect x="34" y="16" width="1" height="3" fill="#ffffff"/>
    <rect x="20" y="16" width="3" height="1" fill="#14503a"/>
    <rect x="31" y="16" width="3" height="1" fill="#14503a"/>
    <rect x="20" y="17" width="3" height="2" fill="#2a9a6a"/>
    <rect x="31" y="17" width="3" height="2" fill="#2a9a6a"/>
    <rect x="22" y="17" width="1" height="1" fill="#ffffff"/>
    <rect x="33" y="17" width="1" height="1" fill="#ffffff"/>
    <rect x="20" y="19" width="3" height="1" fill="#5ad8a0"/>
    <rect x="31" y="19" width="3" height="1" fill="#5ad8a0"/>
    <rect x="19" y="21" width="2" height="1" fill="#ff98a8"/>
    <rect x="33" y="21" width="2" height="1" fill="#ff98a8"/>
    <rect x="26" y="23" width="2" height="1" fill="#c0505a"/>
  </g>
</svg>
