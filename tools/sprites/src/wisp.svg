<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 184">
  <!-- Wisp: a living flame, layers of fire licking upward around a white-hot core, hollow eyes and a
       jagged grin burning in the middle, embers drifting off. The frost wisp swaps these colors
       (see render.mjs): #fffbe8 #fff090 #ffd040 #ff8a20 #e04818 #8a1808 #3a0804 -->
  <defs>
    <path id="flame" d="M76 176 C60 168 52 158 54 148 C34 140 22 120 26 98 C28 82 36 72 40 56 C42 66 46 72 52 74 C50 56 54 34 62 10 C66 28 74 36 82 40 C84 28 94 16 108 6 C104 22 108 34 116 42 C120 36 122 30 122 24 C132 40 136 58 132 76 C140 90 138 114 128 130 C120 144 104 150 96 152 C100 162 92 170 76 176 Z"/>
    <radialGradient id="core" cx="0.5" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#fffbe8"/>
      <stop offset="0.6" stop-color="#fff090"/>
      <stop offset="1" stop-color="#ffd040"/>
    </radialGradient>
  </defs>
  <!-- layers of flame, hotter toward the middle -->
  <use href="#flame" fill="#8a1808"/>
  <use href="#flame" fill="#e04818" transform="translate(76 118) scale(0.84) translate(-76 -112)"/>
  <use href="#flame" fill="#ff8a20" transform="translate(76 124) scale(0.66) translate(-76 -112)"/>
  <use href="#flame" fill="#ffd040" transform="translate(76 130) scale(0.48) translate(-76 -112)"/>
  <ellipse cx="78" cy="116" rx="26" ry="30" fill="url(#core)"/>
  <!-- licks of light on the upper left edges -->
  <path d="M60 22 C58 40 54 56 56 74 C50 62 52 42 60 22 Z" fill="#ffd040"/>
  <path d="M38 70 C34 84 32 98 36 112 C30 100 30 84 38 70 Z" fill="#ff8a20"/>
  <path d="M104 16 C100 30 102 40 110 48 C100 44 98 30 104 16 Z" fill="#ff8a20"/>
  <!-- slanted, scowling eyes and a roaring maw -->
  <path d="M46 92 L78 104 L74 112 C62 116 50 108 46 92 Z" fill="#3a0804"/>
  <path d="M112 90 L84 103 L88 111 C100 114 110 106 112 90 Z" fill="#3a0804"/>
  <circle cx="70" cy="107" r="3" fill="#fffbe8"/>
  <circle cx="92" cy="106" r="2.8" fill="#fffbe8"/>
  <path d="M58 122 C66 118 92 118 100 122 C100 136 90 146 79 146 C68 146 58 136 58 122 Z" fill="#3a0804"/>
  <path d="M64 121 L68 130 L72 121 Z M86 121 L90 130 L94 121 Z M74 146 L79 138 L84 146 Z" fill="#fff090"/>
  <!-- embers -->
  <circle cx="22" cy="60" r="3" fill="#ffd040"/>
  <circle cx="134" cy="34" r="2.6" fill="#ff8a20"/>
  <circle cx="140" cy="100" r="2.4" fill="#ffd040"/>
  <circle cx="14" cy="122" r="2.2" fill="#ff8a20"/>
  <circle cx="92" cy="2.6" r="2.2" fill="#ffd040"/>
</svg>
