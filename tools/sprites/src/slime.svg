<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 136">
  <!-- Slime: a translucent emerald ooze rearing toward the heroes, bubbles floating inside, slanted
       glowing eyes and a fanged grin. Painted with soft gradients, lit from the upper left -->
  <defs>
    <radialGradient id="body" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#d0fff0"/>
      <stop offset="0.14" stop-color="#7eeac4"/>
      <stop offset="0.42" stop-color="#2eb48c"/>
      <stop offset="0.74" stop-color="#17685e"/>
      <stop offset="1" stop-color="#0a3036"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0f4a48" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#17685e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.5" stop-color="#62f0c0" stop-opacity="0"/>
      <stop offset="1" stop-color="#62f0c0" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.45" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#ffffe0"/>
      <stop offset="0.5" stop-color="#ffe848"/>
      <stop offset="1" stop-color="#f08a10"/>
    </radialGradient>
    <clipPath id="inside">
      <path id="shape" d="M12 128 C6 116 14 100 26 88 C38 74 40 50 54 34 C66 20 86 10 104 18 C116 24 118 36 112 44 C124 52 128 68 134 80 C142 94 156 106 152 120 C150 128 142 132 132 132 L24 132 C18 132 14 131 12 128 Z"/>
    </clipPath>
  </defs>
  <!-- body -->
  <use href="#shape" fill="url(#body)"/>
  <g clip-path="url(#inside)">
    <!-- a darker heart deep inside, bubbles rising through the jelly -->
    <ellipse cx="80" cy="100" rx="40" ry="26" fill="url(#core)"/>
    <circle cx="56" cy="106" r="5.5" fill="#b0f8e0" opacity="0.6"/>
    <circle cx="54.5" cy="104.5" r="2.2" fill="#ffffff" opacity="0.85"/>
    <circle cx="104" cy="108" r="4" fill="#b0f8e0" opacity="0.5"/>
    <circle cx="103" cy="107" r="1.6" fill="#ffffff" opacity="0.7"/>
    <circle cx="40" cy="90" r="3" fill="#b0f8e0" opacity="0.55"/>
    <circle cx="124" cy="96" r="2.6" fill="#b0f8e0" opacity="0.45"/>
    <circle cx="82" cy="118" r="2.4" fill="#b0f8e0" opacity="0.45"/>
    <!-- environment light bouncing around the lower right edge -->
    <use href="#shape" fill="none" stroke="url(#rim)" stroke-width="8"/>
    <!-- denser where it pools on the ground -->
    <ellipse cx="82" cy="136" rx="76" ry="9" fill="#0a3036" opacity="0.8"/>
  </g>
  <!-- the crest folding over at the top -->
  <path d="M104 18 C116 24 118 36 112 44 C106 40 98 40 92 42 C98 34 102 26 104 18 Z" fill="#17685e"/>
  <path d="M100 22 C104 28 104 34 100 38" fill="none" stroke="#7eeac4" stroke-width="2"/>
  <!-- a drip sliding down the left side -->
  <path d="M30 98 C25 106 23 114 25 120 C27 125 33 124 33 118 C33 112 32 106 30 98 Z" fill="#17685e"/>
  <path d="M27.5 110 C27 114 27.5 118 29 119" fill="none" stroke="#7eeac4" stroke-width="1.8"/>
  <!-- glossy highlights -->
  <path d="M48 48 C56 34 72 24 88 22 C78 28 66 38 60 52 C57 58 46 56 48 48 Z" fill="#f4fffc"/>
  <ellipse cx="38" cy="72" rx="3.6" ry="6" fill="#e0fff4" transform="rotate(28 38 72)"/>
  <!-- slanted glowing eyes in dark hollows -->
  <path d="M74 60 C82 52 96 52 102 58 C98 68 84 72 76 68 Z" fill="#0a3036"/>
  <path d="M110 58 C116 52 126 54 130 60 C126 68 116 70 111 66 Z" fill="#0a3036"/>
  <path d="M78 61 C85 56 95 56 99 60 C95 66 85 68 80 66 Z" fill="url(#eye)"/>
  <path d="M113 60 C118 56 125 57 127 61 C124 66 117 67 114 65 Z" fill="url(#eye)"/>
  <path d="M90 57 L91 67 M121 58 L121 66" stroke="#2a1006" stroke-width="3" stroke-linecap="round"/>
  <!-- fanged grin -->
  <path d="M76 80 C90 90 114 90 130 78 C126 94 92 100 76 80 Z" fill="#081e14"/>
  <path d="M84 85 L87 92 L90 87 Z M116 86 L118 93 L121 85 Z M100 89 L102 95 L104 89 Z" fill="#f0fff0"/>
  <path d="M86 92 C98 96 112 95 122 89" fill="none" stroke="#2eb48c" stroke-width="1.4"/>
</svg>
