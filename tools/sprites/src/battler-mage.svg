<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 45">
  <!-- Mage girl, anime JRPG style, 3/4 view facing right: long golden hair, big eyes, wide witch hat, blue robe, orb staff. Cel shaded -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.62" stop-color="#ffe8d4"/><stop offset="0.62" stop-color="#f4b89c"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ffe27a"/><stop offset="0.5" stop-color="#d89a2a"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#5a6af0"/><stop offset="0.5" stop-color="#3236a8"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ffffff"/><stop offset="0.5" stop-color="#c4cce8"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#7a52d8"/><stop offset="0.5" stop-color="#422690"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ffe070"/><stop offset="0.5" stop-color="#cc9228"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#c88c54"/><stop offset="0.5" stop-color="#7a4a24"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#a86e3c"/><stop offset="0.5" stop-color="#6a4020"/></linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1"><stop offset="0.45" stop-color="#c8f8ff"/><stop offset="0.45" stop-color="#3ab0ec"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0.5" stop-color="#14503a"/><stop offset="0.5" stop-color="#3ac08a"/></linearGradient>
  </defs>
  <g transform="scale(0.5625)">
  <g stroke="#1e1430" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- long hair down the back -->
    <path d="M20 20 C13 30 13 46 17 58 L23 55 L27 58 L30 34 Z" fill="url(#hair)"/>
    <!-- staff in front of the body -->
    <path d="M56.5 14 L53.5 78" stroke="url(#wood)" stroke-width="2.6"/>
    <circle cx="56.8" cy="10" r="5" fill="none" stroke="url(#gold)" stroke-width="1.8"/>
    <circle cx="56.8" cy="10" r="3.2" fill="url(#orb)"/>
    <!-- feet, A-line robe with white hem, collar and sash -->
    <path d="M28 74 L35 74 L35 78 L27 78 Z M38 74 L45 74 L46 78 L38 78 Z" fill="url(#leather)"/>
    <path d="M28 33 C29 30 43 30 44 33 L46 48 C48 58 50 68 52 76 L22 76 C24 68 26 58 28 48 Z" fill="url(#robe)"/>
    <path d="M23.2 71 C32 73 43 73 51 71 L52 76 L22 76 Z" fill="url(#white)"/>
    <path d="M30 31 L36 38 L42 31 L40 30 L36 34 L32 30 Z" fill="url(#white)" stroke-width="1"/>
    <path d="M27.4 46 C33 48 41 48 45.6 46 L46 49.5 C41 51.5 33 51.5 27 49.5 Z" fill="url(#gold)" stroke-width="1"/>
    <!-- sleeves and hands, the near hand grips the staff -->
    <path d="M29 34 C23 38 21 46 22 52 L27 52 C27 47 28 42 31 39 Z" fill="url(#robe)"/>
    <ellipse cx="24.5" cy="53" rx="2.2" ry="2" fill="url(#skin)"/>
    <path d="M40 33 C48 35 52 40 53 45 L48 47 C47 42 44 39 39 37 Z" fill="url(#robe)"/>
    <ellipse cx="53.8" cy="47" rx="2.4" ry="2.2" fill="url(#skin)"/>
    <!-- neck, hair behind the head, face -->
    <path d="M34 27 L40 27 L40 32 L34 32 Z" fill="url(#skin)"/>
    <path d="M19 22 C15 12 23 4 34 4 C44 4 50 9 51 15 L30 17 L30 26 Z" fill="url(#hair)"/>
    <path d="M24 16 C24 7 33 3 40 3 C47 4 50 10 49 17 C48 23 45 28 40 30 C35 30 28 27 25 22 Z" fill="url(#skin)"/>
    <!-- soft bangs and a lock of hair by the cheek -->
    <path d="M27 14 C28 7 36 4 43 5 C48 6 51 10 51 14 L50 19 L48 13 C46 15 44 15 42 13 C41 15 38 15 37 12 C35 14 33 17 32 22 L29 23 Z" fill="url(#hair)"/>
    <path d="M48 13 C51 18 51 24 49 29 L47 28 C48 23 48 18 46 15 Z" fill="url(#hair)"/>
    <!-- witch hat: bent cone, brim, gold band -->
    <path d="M33 2 C28 1 22 2 16 6 C22 5.5 26 5 29 4.5 Z" fill="url(#hat)"/>
    <path d="M27 7 C29 3 33 1 37 1 C41 1 44 3 46 6 Z" fill="url(#hat)"/>
    <path d="M13 9 C22 4 50 2 58 7 C50 12 22 13 13 9 Z" fill="url(#hat)"/>
    <path d="M27 5.6 C34 4.2 40 4.2 46 5.2 L46.4 7.4 C40 6.6 34 6.6 27 8 Z" fill="url(#gold)" stroke-width="0.9"/>
  </g>
  </g>
  <!-- eyes and mouth placed pixel by pixel on the 36x45 sprite grid so they stay crisp -->
  <g>
    <rect x="23" y="8" width="3" height="1" fill="#1e1224"/>
    <rect x="19" y="8" width="2" height="1" fill="#1e1224"/>
    <rect x="23" y="9" width="1" height="2" fill="#ffffff"/>
    <rect x="24" y="9" width="2" height="1" fill="#14503a"/>
    <rect x="24" y="10" width="1" height="1" fill="#2a9a6a"/>
    <rect x="25" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="24" y="11" width="2" height="1" fill="#5ad8a0"/>
    <rect x="20" y="9" width="1" height="1" fill="#14503a"/>
    <rect x="20" y="10" width="1" height="1" fill="#2a9a6a"/>
    <rect x="20" y="11" width="1" height="1" fill="#5ad8a0"/>
    <rect x="26" y="7" width="1" height="1" fill="#1e1224"/>
    <rect x="24" y="13" width="2" height="1" fill="#ff98a8"/>
    <rect x="23" y="14" width="2" height="1" fill="#c0505a"/>
  </g>
</svg>
