<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50">
  <!-- Mage, 3/4 view facing right (flipped in game): wide witch hat with a gold band, long golden hair,
       blue robes with a white hem and gold trim, a staff crowned with a blue crystal.
       Four tones per material in hard-edged bands lit from the upper left, interior lines in a dark shade
       of the material. Drawn at 4 units per pixel, the eyes and mouth are placed pixel by pixel at the end -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.45" stop-color="#ffecdc"/><stop offset="0.45" stop-color="#fcd0b4"/><stop offset="0.8" stop-color="#fcd0b4"/><stop offset="0.8" stop-color="#e8a48a"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#a888f0"/><stop offset="0.3" stop-color="#6a46c8"/><stop offset="0.65" stop-color="#6a46c8"/><stop offset="0.65" stop-color="#4a2c96"/></linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="1" y2="0.3"><stop offset="0.35" stop-color="#8a68e0"/><stop offset="0.35" stop-color="#5a38b0"/><stop offset="0.75" stop-color="#5a38b0"/><stop offset="0.75" stop-color="#3a2280"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#fff4b0"/><stop offset="0.3" stop-color="#ffd860"/><stop offset="0.65" stop-color="#ffd860"/><stop offset="0.65" stop-color="#d8a838"/><stop offset="0.88" stop-color="#d8a838"/><stop offset="0.88" stop-color="#a87a20"/></linearGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#8090f8"/><stop offset="0.3" stop-color="#4a5ae0"/><stop offset="0.66" stop-color="#4a5ae0"/><stop offset="0.66" stop-color="#2e38a8"/></linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="1"><stop offset="0.45" stop-color="#4a5ae0"/><stop offset="0.45" stop-color="#2e38a8"/></linearGradient>
    <linearGradient id="hem" x1="0" y1="0" x2="1" y2="0"><stop offset="0.55" stop-color="#ffffff"/><stop offset="0.55" stop-color="#c8d0f0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.4" stop-color="#fff0a0"/><stop offset="0.4" stop-color="#f0c040"/><stop offset="0.75" stop-color="#f0c040"/><stop offset="0.75" stop-color="#b07a18"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0.45" stop-color="#d0a060"/><stop offset="0.45" stop-color="#8a5a28"/></linearGradient>
    <linearGradient id="crystal" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#e0fcff"/><stop offset="0.3" stop-color="#7ad4ff"/><stop offset="0.65" stop-color="#7ad4ff"/><stop offset="0.65" stop-color="#2a78d8"/></linearGradient>
  </defs>
  <g transform="scale(0.25) translate(0 8)">
  <g stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- long hair flowing down the back -->
    <path d="M66 50 C52 70 48 100 50 128 C52 140 58 146 64 144 C60 130 62 116 66 104 C70 120 74 132 82 136 C78 112 80 86 84 64 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <path d="M58 92 C56 108 56 122 60 134 M70 96 C70 110 72 122 76 130" fill="none" stroke="#a87a20" stroke-width="2.4"/>
    <!-- robe down to a white hem -->
    <path d="M70 80 C64 104 58 140 52 180 L128 180 C124 140 118 104 110 80 Z" fill="url(#robe)" stroke="#121a5a"/>
    <path d="M52 172 L128 172 L130 190 L50 190 Z" fill="url(#hem)" stroke="#5a6aa8"/>
    <path d="M90 84 C92 116 94 148 96 172" fill="none" stroke="#f0c040" stroke-width="4"/>
    <path d="M70 120 C68 140 66 158 64 172 M110 124 C112 140 114 156 116 172" fill="none" stroke="#2e38a8" stroke-width="2.4"/>
    <!-- gold belt -->
    <path d="M66 112 L114 112 L115 122 L65 122 Z" fill="url(#gold)" stroke="#6a4008"/>
    <!-- far sleeve -->
    <path d="M72 84 C62 96 58 112 62 124 L74 124 C72 112 74 100 80 92 Z" fill="url(#sleeve)" stroke="#121a5a"/>
    <!-- staff in front with a crystal held in a gold claw -->
    <path d="M124 196 L130 40 L138 40 L132 196 Z" fill="url(#wood)" stroke="#4a2c10"/>
    <path d="M124 44 C120 34 124 26 134 24 C144 26 148 34 144 44 L138 40 L134 46 L130 40 Z" fill="url(#gold)" stroke="#6a4008"/>
    <path d="M134 2 L146 18 L134 36 L122 18 Z" fill="url(#crystal)" stroke="#1a3a80"/>
    <path d="M128 16 L134 8" fill="none" stroke="#ffffff" stroke-width="2.4"/>
    <!-- near sleeve and hand on the staff -->
    <path d="M100 84 C114 88 122 98 124 110 L112 120 C108 110 102 102 96 98 Z" fill="url(#sleeve)" stroke="#121a5a"/>
    <path d="M106 110 C112 102 124 104 128 112 L116 124 C110 122 106 116 106 110 Z" fill="url(#robe)" stroke="#121a5a"/>
    <path d="M120 104 C126 100 136 104 136 112 C136 120 128 124 122 120 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <!-- collar -->
    <path d="M76 78 C84 86 98 86 106 78 L102 90 C94 94 86 94 80 90 Z" fill="url(#hem)" stroke="#5a6aa8"/>
    <!-- head -->
    <path d="M72 50 C70 26 84 16 98 16 C114 16 126 28 126 46 C126 60 120 70 106 76 C94 80 80 76 76 66 C74 62 72 56 72 50 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <!-- bangs and a lock framing the face -->
    <path d="M72 40 C74 26 88 18 104 18 C118 20 128 28 128 40 L122 42 L118 32 L112 40 L106 30 L100 40 L94 30 L88 42 C82 46 80 54 80 64 C78 74 76 84 72 92 C68 80 68 60 72 40 Z" fill="url(#hair)" stroke="#6a4a10"/>
    <path d="M88 22 C96 19 106 19 114 22" fill="none" stroke="#fff4b0" stroke-width="2.6"/>
    <!-- wide witch hat: brim, crown bending back, gold band -->
    <path d="M44 34 C52 24 82 18 110 20 C130 22 146 28 148 34 C140 40 112 42 84 40 C64 40 50 38 44 34 Z" fill="url(#brim)" stroke="#2a1660"/>
    <path d="M68 30 C68 16 72 4 64 -6 C84 -6 100 4 106 14 C110 20 112 26 112 30 C98 34 82 34 68 30 Z" fill="url(#hat)" stroke="#2a1660"/>
    <path d="M68 26 C82 30 98 30 112 26 L112 32 C98 36 82 36 68 32 Z" fill="url(#gold)" stroke="#6a4008" stroke-width="2.4"/>
    <path d="M70 18 C72 10 72 4 68 -2" fill="none" stroke="#c0a8ff" stroke-width="2.4"/>
  </g>
  </g>
  <!-- face on the 40x50 pixel grid: brows, green eyes with a shine, blush, a small smile -->
  <g>
    <rect x="21" y="12" width="3" height="1" fill="#1e1224"/>
    <rect x="27" y="12" width="2" height="1" fill="#1e1224"/>
    <rect x="20" y="12" width="1" height="1" fill="#1e1224"/>
    <rect x="21" y="13" width="2" height="1" fill="#0e4a30"/>
    <rect x="23" y="13" width="1" height="2" fill="#ffffff"/>
    <rect x="21" y="14" width="1" height="1" fill="#2aa070"/>
    <rect x="22" y="14" width="1" height="1" fill="#ffffff"/>
    <rect x="21" y="15" width="2" height="1" fill="#3ac08a"/>
    <rect x="27" y="13" width="1" height="1" fill="#0e4a30"/>
    <rect x="28" y="13" width="1" height="2" fill="#ffffff"/>
    <rect x="27" y="14" width="1" height="1" fill="#2aa070"/>
    <rect x="27" y="15" width="1" height="1" fill="#3ac08a"/>
    <rect x="20" y="16" width="2" height="1" fill="#ff98a8"/>
    <rect x="25" y="17" width="2" height="1" fill="#d0707a"/>
  </g>
</svg>
