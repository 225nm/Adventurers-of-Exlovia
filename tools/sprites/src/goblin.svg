<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 216">
  <!-- Goblin: a hunched, wiry goblin in a ragged leather vest, gripping a crude spear with a red rag tied
       under the blade. Long ears, hooked nose, beady eyes and a jagged grin. Faces right, lit from the upper left -->
  <defs>
    <radialGradient id="skin" cx="0.32" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#ece6a0"/>
      <stop offset="0.3" stop-color="#b4aa56"/>
      <stop offset="0.7" stop-color="#76702e"/>
      <stop offset="1" stop-color="#363214"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8c06a"/>
      <stop offset="0.45" stop-color="#948c3e"/>
      <stop offset="1" stop-color="#46421c"/>
    </linearGradient>
    <linearGradient id="limbFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#847c34"/>
      <stop offset="1" stop-color="#363214"/>
    </linearGradient>
    <radialGradient id="vest" cx="0.3" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#c08a52"/>
      <stop offset="0.45" stop-color="#7e4e2c"/>
      <stop offset="1" stop-color="#36200e"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6a44"/>
      <stop offset="1" stop-color="#3a2a18"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8a868"/>
      <stop offset="0.5" stop-color="#9a6a38"/>
      <stop offset="1" stop-color="#5a3a1c"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0f2f8"/>
      <stop offset="0.45" stop-color="#a8b0c4"/>
      <stop offset="0.55" stop-color="#6a7088"/>
      <stop offset="1" stop-color="#3a3e52"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffffd0"/>
      <stop offset="0.6" stop-color="#f0d040"/>
      <stop offset="1" stop-color="#b07010"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1408" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- far leg -->
    <path d="M70 142 C62 152 52 162 50 172 C48 182 50 194 50 202 L40 208 C38 212 66 212 66 208 L60 200 C60 190 62 180 66 172 C72 162 80 154 82 146 Z" fill="url(#limbFar)"/>
    <!-- far arm reaching behind the body to the spear -->
    <path d="M74 92 C66 104 72 116 88 118 C108 120 130 116 150 108 L152 120 C130 126 108 130 88 128 C72 126 62 112 66 100 Z" fill="url(#limbFar)"/>
    <path d="M148 104 C154 100 162 102 164 108 C166 116 160 122 152 122 C146 120 144 110 148 104 Z" fill="url(#limbFar)"/>
    <!-- spear -->
    <path d="M150 210 L163 34 L171 35 L158 211 Z" fill="url(#shaft)"/>
    <path d="M167 2 C177 16 180 30 174 44 L158 42 C154 28 158 14 167 2 Z" fill="url(#iron)"/>
    <path d="M166 10 C168 22 168 32 166 42" fill="none" stroke="#3a3e52" stroke-width="1.4"/>
    <path d="M157 44 L176 46 L175 54 L156 52 Z" fill="#6a4424"/>
    <path d="M158 52 C152 60 150 70 154 80 C158 72 160 64 166 58 C164 70 168 78 172 82 C172 70 172 60 170 53 Z" fill="#c83a34"/>
    <path d="M160 55 C157 62 157 68 158 72" fill="none" stroke="#f07a60" stroke-width="1.6"/>
    <!-- near leg -->
    <path d="M98 142 C106 152 118 160 122 170 C126 180 124 192 124 200 L116 208 C114 212 144 212 142 207 L134 200 C136 188 136 176 132 166 C126 154 116 146 112 140 Z" fill="url(#limb)"/>
    <path d="M118 168 C122 166 128 168 128 172" fill="none" stroke="#363214" stroke-width="1.6"/>
    <!-- loincloth and belt -->
    <path d="M68 136 L114 134 L118 160 L104 154 L96 166 L86 152 L72 160 Z" fill="url(#cloth)"/>
    <!-- hunched torso in a ragged vest -->
    <path d="M66 96 C62 84 76 76 92 76 C110 76 122 86 122 100 C122 116 118 130 114 140 L68 142 C64 128 66 110 66 96 Z" fill="url(#skin)"/>
    <path d="M64 98 C62 86 74 78 86 78 L96 104 L90 140 L68 142 C64 128 62 112 64 98 Z" fill="url(#vest)"/>
    <path d="M112 84 C120 90 122 100 120 112 L104 108 L108 90 Z" fill="url(#vest)"/>
    <path d="M86 80 L96 104 L90 140 M104 108 L108 90" fill="none" stroke="#1a1408" stroke-width="1.6"/>
    <path d="M72 96 L76 112 M80 92 L84 104" fill="none" stroke="#d8a868" stroke-width="1.4" opacity="0.8"/>
    <path d="M66 132 L116 130 L116 140 L66 142 Z" fill="#4a2c16"/>
    <path d="M88 131 L96 131 L96 141 L88 141 Z" fill="#c8b070"/>
    <!-- head: bald, heavy brow, long ears -->
    <path d="M84 46 C70 38 52 30 30 28 C40 40 56 52 76 62 Z" fill="url(#skin)"/>
    <path d="M78 50 C66 44 52 38 40 34 C50 44 62 52 74 58 Z" fill="#c86a6a" stroke="none" opacity="0.8"/>
    <path d="M122 42 C138 30 156 22 176 22 C166 36 148 48 128 56 Z" fill="url(#skin)"/>
    <path d="M126 46 C140 36 154 30 166 28 C156 40 142 48 130 52 Z" fill="#c86a6a" stroke="none" opacity="0.8"/>
    <path d="M78 54 C76 34 90 22 106 22 C124 22 136 34 136 50 C136 58 134 62 132 66 L146 76 C146 82 140 84 134 82 C130 90 120 96 108 96 C92 96 80 74 78 54 Z" fill="url(#skin)"/>
    <!-- brow, eyes -->
    <path d="M92 48 C100 42 112 42 120 46 L132 44 C130 50 124 54 116 54 L96 56 Z" fill="#5e5822"/>
    <ellipse cx="107" cy="56" rx="7.5" ry="6.5" fill="url(#eye)"/>
    <ellipse cx="129" cy="52" rx="5.6" ry="5.4" fill="url(#eye)"/>
    <circle cx="110" cy="56.5" r="3" fill="#a01010" stroke="none"/>
    <circle cx="131" cy="52.5" r="2.4" fill="#a01010" stroke="none"/>
    <path d="M98 48 C104 46 112 48 118 52 M124 47 L135 44" fill="none" stroke="#1a1408" stroke-width="3"/>
    <!-- hooked nose -->
    <path d="M122 60 C130 62 142 68 148 77 C143 80 136 78 131 75 C126 71 122 66 122 60 Z" fill="url(#skin)"/>
    <!-- jagged grin with tusks -->
    <path d="M104 78 C112 84 124 84 132 80 C128 90 112 92 104 78 Z" fill="#3a0c08"/>
    <path d="M108 80 L111 86 L113 81 M118 82 L120 88 L122 82 M126 81 L128 86" fill="#fff8e0" stroke-width="1"/>
    <path d="M106 80 L104 72 L110 79 Z M130 80 L134 73 L132 81 Z" fill="#fff8e0" stroke-width="1"/>
    <!-- near arm and fist on the spear -->
    <path d="M106 88 C122 90 132 102 132 116 C132 124 138 130 148 130 L148 142 C132 142 120 134 118 120 C118 108 112 100 102 98 Z" fill="url(#limb)"/>
    <path d="M142 128 C148 123 160 125 163 132 C165 140 159 147 150 147 C143 145 140 136 142 128 Z" fill="url(#skin)"/>
    <path d="M150 129 L160 131 M149 135 L161 137 M150 141 L159 142" fill="none" stroke="#363214" stroke-width="1.4"/>
  </g>
</svg>
