<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 120">
  <!-- Map pine: four tiers of drooping boughs, lit on their left, over a short trunk -->
  <defs>
    <linearGradient id="bough" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#5aa058"/>
      <stop offset="0.38" stop-color="#2e6e44"/>
      <stop offset="1" stop-color="#173c2c"/>
    </linearGradient>
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a87850"/>
      <stop offset="1" stop-color="#46301a"/>
    </linearGradient>
  </defs>
  <path d="M31 120 L32 98 L40 98 L41 120 Z" fill="url(#bark)"/>
  <!-- tiers from the bottom up, each a cone with a ragged hem -->
  <path d="M36 50 L68 98 L58 96 L52 102 L44 98 L36 104 L28 98 L20 102 L14 96 L4 98 Z" fill="url(#bough)"/>
  <path d="M36 32 L62 74 L52 72 L46 78 L36 74 L26 78 L20 72 L10 74 Z" fill="url(#bough)"/>
  <path d="M36 16 L56 52 L46 50 L36 56 L26 50 L16 52 Z" fill="url(#bough)"/>
  <path d="M36 0 L50 30 L42 28 L36 32 L30 28 L22 30 Z" fill="url(#bough)"/>
  <!-- light on the left of each tier -->
  <path d="M36 50 L18 80 L10 92 L22 84 L32 62 Z M36 32 L20 60 L14 70 L26 62 L33 44 Z M36 16 L24 40 L19 48 L28 42 L34 26 Z M36 0 L27 20 L24 27 L31 22 Z" fill="#8ccc78"/>
  <!-- shade under each tier -->
  <path d="M10 74 L20 72 L26 78 L36 74 L46 78 L52 72 L62 74 L60 80 L36 82 L12 80 Z M16 52 L26 50 L36 56 L46 50 L56 52 L54 58 L36 60 L18 58 Z M22 30 L30 28 L36 32 L42 28 L50 30 L48 34 L36 36 L24 34 Z" fill="#102a20" opacity="0.7"/>
</svg>
