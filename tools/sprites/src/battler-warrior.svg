<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 45">
  <!-- Warrior, anime JRPG style, 3/4 view facing right: spiky hair, big eyes, plate armor, red cape, round shield, sword raised forward.
       Cel shaded: every material is a light and a shadow tone split by a hard edge -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.62" stop-color="#ffe4cc"/><stop offset="0.62" stop-color="#f2b394"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#d47a3a"/><stop offset="0.5" stop-color="#8a4420"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#f0f4fc"/><stop offset="0.5" stop-color="#a4b2cc"/></linearGradient>
    <linearGradient id="steelDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#b4c0d8"/><stop offset="0.5" stop-color="#6a7894"/></linearGradient>
    <linearGradient id="cape" x1="1" y1="0" x2="0" y2="1"><stop offset="0.45" stop-color="#e8404a"/><stop offset="0.45" stop-color="#9a1a2e"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#4a7ae0"/><stop offset="0.5" stop-color="#2a46a0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ffe070"/><stop offset="0.5" stop-color="#cc9228"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#a86e3c"/><stop offset="0.5" stop-color="#6a4020"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#4c4c6c"/><stop offset="0.5" stop-color="#2e2e48"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#4a82ea"/><stop offset="0.5" stop-color="#2446a8"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0.5" stop-color="#1a2a6a"/><stop offset="0.5" stop-color="#4a90f0"/></linearGradient>
  </defs>
  <g transform="scale(0.5625)">
  <g stroke="#1e1224" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- cape flowing behind -->
    <path d="M30 32 C20 40 15 58 12 76 L34 76 L36 34 Z" fill="url(#cape)"/>
    <!-- legs and boots -->
    <path d="M29 58 L35 58 L35 69 L29 69 Z" fill="url(#pants)"/>
    <path d="M27 68 L36 68 L36 76 L25 76 C25 72 26 70 27 68 Z" fill="url(#leather)"/>
    <path d="M37 58 L43 58 L43 69 L37 69 Z" fill="url(#pants)"/>
    <path d="M36 68 L44 68 C46 70 48 73 48 76 L36 76 Z" fill="url(#leather)"/>
    <!-- tunic skirt, breastplate, belt -->
    <path d="M27 50 L45 50 L47 61 L25 61 Z" fill="url(#tunic)"/>
    <path d="M27 34 C28 31 44 31 45 34 L45 51 L27 51 Z" fill="url(#steel)"/>
    <path d="M36 37 L39 41 L36 45 L33 41 Z" fill="url(#gold)" stroke-width="0.9"/>
    <path d="M26 49 L46 49 L46 53 L26 53 Z" fill="url(#leather)"/>
    <path d="M34 49 L38 49 L38 53 L34 53 Z" fill="url(#gold)" stroke-width="0.8"/>
    <!-- round shield on the far arm -->
    <circle cx="20" cy="46" r="10.5" fill="url(#shield)"/>
    <circle cx="20" cy="46" r="7.8" fill="none" stroke="#ffd860" stroke-width="1.8"/>
    <circle cx="20" cy="46" r="10.5" fill="none"/>
    <circle cx="20" cy="46" r="2.4" fill="url(#gold)"/>
    <!-- sword raised forward -->
    <path d="M46 46 L58 27 L60.5 28.5 L49 48 Z" fill="url(#steel)" stroke-width="1.1"/>
    <path d="M41.5 44.5 L50.5 50 L51.5 48 L42.5 42.5 Z" fill="url(#gold)" stroke-width="1"/>
    <!-- near arm, gauntlet, pauldron -->
    <path d="M39 34 C46 36 48 42 47 48 L42 48 C42 43 41 39 37 37 Z" fill="url(#steelDark)"/>
    <path d="M41 46 L48 46 L48 52 L41 52 Z" fill="url(#steel)"/>
    <path d="M35 33 C35 27 47 27 49 33 C49 37 44 39 39 38 C36 37 35 35 35 33 Z" fill="url(#steel)"/>
    <!-- neck, spiky hair behind, face -->
    <path d="M34 27 L40 27 L40 33 L34 33 Z" fill="url(#skin)"/>
    <path d="M20 24 C14 18 15 9 21 6 L17 2 L27 3 C31 0 39 0 44 2 L48 0 L48 5 C52 7 54 11 53 15 L57 16 L51 19 L49 13 L29 15 L30 26 C26 27 22 26 20 24 Z" fill="url(#hair)"/>
    <path d="M24 16 C24 7 33 3 40 3 C47 4 50 10 49 17 C48 23 45 28 40 30 C35 30 28 27 25 22 Z" fill="url(#skin)"/>
    <!-- spiky bangs over the forehead -->
    <path d="M27 14 C28 6 36 3 43 4 C48 5 51 9 51 13 L49 16 L47 11 L45 14.5 L43 10 L40.5 14 L39 10 L36.5 14 L36 10 C33 12 31 16 31 21 L28 22 Z" fill="url(#hair)"/>
  </g>
  </g>
  <!-- eyes and mouth placed pixel by pixel on the 36x45 sprite grid so they stay crisp -->
  <g>
    <rect x="23" y="8" width="3" height="1" fill="#1e1224"/>
    <rect x="19" y="8" width="2" height="1" fill="#1e1224"/>
    <rect x="23" y="9" width="1" height="2" fill="#ffffff"/>
    <rect x="24" y="9" width="2" height="1" fill="#1a2a6a"/>
    <rect x="24" y="10" width="1" height="1" fill="#3a6ad0"/>
    <rect x="25" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="24" y="11" width="2" height="1" fill="#6ab4ff"/>
    <rect x="20" y="9" width="1" height="1" fill="#1a2a6a"/>
    <rect x="20" y="10" width="1" height="1" fill="#3a6ad0"/>
    <rect x="20" y="11" width="1" height="1" fill="#6ab4ff"/>
    <rect x="23" y="14" width="2" height="1" fill="#b86a58"/>
  </g>
</svg>
