<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 152">
  <!-- Bat: a giant cave bat with its wings spread, the membranes glowing where light shines through
       between the finger bones, shaggy fur, tall ears, burning red eyes and fangs. Lit from the upper left -->
  <defs>
    <linearGradient id="wingL" x1="1" y1="0.4" x2="0" y2="0.6">
      <stop offset="0" stop-color="#24102c"/>
      <stop offset="0.5" stop-color="#4a2048"/>
      <stop offset="1" stop-color="#7a3a64"/>
    </linearGradient>
    <linearGradient id="wingR" x1="0" y1="0.4" x2="1" y2="0.6">
      <stop offset="0" stop-color="#2e1434"/>
      <stop offset="0.5" stop-color="#5a2852"/>
      <stop offset="1" stop-color="#8e4670"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#b08498"/>
      <stop offset="0.35" stop-color="#6e4660"/>
      <stop offset="0.75" stop-color="#3a2038"/>
      <stop offset="1" stop-color="#1e0e20"/>
    </radialGradient>
    <radialGradient id="head" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#c094a8"/>
      <stop offset="0.4" stop-color="#7a5068"/>
      <stop offset="1" stop-color="#2a1430"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffc8"/>
      <stop offset="0.35" stop-color="#ffb040"/>
      <stop offset="0.7" stop-color="#ff3020"/>
      <stop offset="1" stop-color="#a00818"/>
    </radialGradient>
    <linearGradient id="ear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e88aa0"/>
      <stop offset="1" stop-color="#8a3050"/>
    </linearGradient>
  </defs>
  <!-- far wing -->
  <path d="M106 64 L62 38 L6 30 Q30 48 12 72 Q38 78 32 102 Q54 90 70 106 Q88 94 104 104 Z" fill="url(#wingL)"/>
  <!-- light through the membrane between the fingers -->
  <path d="M60 44 L14 34 Q28 48 18 66 Z" fill="#a85a80" opacity="0.45"/>
  <path d="M62 48 L20 72 Q38 76 36 94 Z" fill="#a85a80" opacity="0.35"/>
  <!-- arm and finger bones -->
  <path d="M106 64 L62 38 M62 38 L6 30 M62 38 L12 72 M62 38 L32 102 M62 38 L70 106" fill="none" stroke="#1a0a1c" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 62 L62 37 M62 37 L8 29 M61 38 L13 70 M61 38 L32 100 M62 39 L69 104" fill="none" stroke="#b4889c" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M62 38 L56 26 L64 33" fill="#e8d8c8" stroke="#1a0a1c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- near wing -->
  <path d="M136 64 L180 36 L228 26 Q206 48 222 70 Q196 78 202 102 Q180 90 164 106 Q148 94 136 104 Z" fill="url(#wingR)"/>
  <path d="M182 42 L220 30 Q208 46 216 64 Z" fill="#c06a90" opacity="0.45"/>
  <path d="M180 46 L214 70 Q198 76 198 94 Z" fill="#c06a90" opacity="0.35"/>
  <path d="M136 64 L180 36 M180 36 L228 26 M180 36 L222 70 M180 36 L202 102 M180 36 L164 106" fill="none" stroke="#1a0a1c" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 62 L180 35 M180 35 L226 25 M181 36 L221 68 M181 37 L201 100 M180 37 L165 104" fill="none" stroke="#d0a4b6" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M180 36 L186 24 L178 31" fill="#f4e8dc" stroke="#1a0a1c" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- feet -->
  <path d="M110 112 L106 124 M114 113 L112 125 M128 113 L130 125 M132 112 L136 124" stroke="#1a0a1c" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M110 112 L106.5 123 M114 113 L112.3 124 M128 113 L129.7 124 M132 112 L135.5 123" stroke="#d8c0b0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- shaggy body -->
  <path d="M120 54 C104 54 98 66 100 80 C101 92 104 104 108 112 L112 108 L116 116 L121 110 L126 116 L130 108 L134 112 C138 104 141 92 142 80 C144 66 136 54 120 54 Z" fill="url(#fur)"/>
  <path d="M112 66 L108 74 L114 72 M110 82 L106 90 L112 88 M118 62 L116 68" fill="none" stroke="#d8b0c0" stroke-width="1.6" stroke-linecap="round" opacity="0.8"/>
  <path d="M134 84 L138 92 M130 98 L134 104" fill="none" stroke="#1a0a1c" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>
  <!-- ears -->
  <path d="M112 44 L104 10 L126 38 Z" fill="url(#head)"/>
  <path d="M112.5 40 L107.5 17 L121 36 Z" fill="url(#ear)"/>
  <path d="M132 38 L150 8 L146 44 Z" fill="url(#head)"/>
  <path d="M135 37 L147 15 L144 40 Z" fill="url(#ear)"/>
  <!-- head with a short snout turned toward the heroes -->
  <path d="M106 46 C106 34 116 28 126 28 C138 28 146 36 146 46 C146 52 150 56 148 60 C144 66 134 68 126 68 C114 68 106 58 106 46 Z" fill="url(#head)"/>
  <path d="M138 52 C142 50 148 52 148 58 C146 62 140 62 138 58 Z" fill="#4a2440"/>
  <path d="M142 54 L144 56" stroke="#120612" stroke-width="2" stroke-linecap="round"/>
  <!-- burning eyes under a heavy brow -->
  <ellipse cx="119" cy="45" rx="6" ry="5" fill="#200a14"/>
  <ellipse cx="135" cy="44" rx="5.2" ry="4.6" fill="#200a14"/>
  <ellipse cx="119.5" cy="45.5" rx="4.4" ry="3.6" fill="url(#glow)"/>
  <ellipse cx="135.5" cy="44.5" rx="3.8" ry="3.2" fill="url(#glow)"/>
  <path d="M111 38 L126 42 M130 40 L142 37" stroke="#1a0a1c" stroke-width="2.6" stroke-linecap="round"/>
  <!-- snarling mouth and fangs -->
  <path d="M116 58 C122 64 132 64 140 60 C136 70 120 70 116 58 Z" fill="#3a0812"/>
  <path d="M120 60 L122 68 L124 61 Z M133 61 L135 68 L137 60 Z" fill="#fffaf0"/>
</svg>
