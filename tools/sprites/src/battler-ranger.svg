<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 45">
  <!-- Ranger, anime JRPG style, 3/4 view facing right: green hood, chestnut bangs, big eyes, red scarf, leather tunic, quiver, longbow. Cel shaded -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.62" stop-color="#ffe4cc"/><stop offset="0.62" stop-color="#f2b394"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#b8662e"/><stop offset="0.5" stop-color="#6e3618"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#5cc04c"/><stop offset="0.5" stop-color="#2c7a30"/></linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#f05a3a"/><stop offset="0.5" stop-color="#a82e1e"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#c08a50"/><stop offset="0.5" stop-color="#7c4c26"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#8a5a30"/><stop offset="0.5" stop-color="#553418"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#56663e"/><stop offset="0.5" stop-color="#344024"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#d09858"/><stop offset="0.5" stop-color="#7a4a22"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.5" stop-color="#ffe070"/><stop offset="0.5" stop-color="#cc9228"/></linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1"><stop offset="0.5" stop-color="#6a3a0a"/><stop offset="0.5" stop-color="#e0a030"/></linearGradient>
  </defs>
  <g transform="scale(0.5625)">
  <g stroke="#1a1a14" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round">
    <!-- cloak behind, quiver with arrows on the back -->
    <path d="M29 32 C21 42 18 60 17 74 L34 72 L35 34 Z" fill="url(#hood)"/>
    <path d="M23.5 29 L23 23.5 M25.5 28.5 L25.5 23 M27.5 28 L28 22.5" stroke="#f0ecd8" stroke-width="1.4"/>
    <path d="M22 30 L27 28 L30 50 L25 52 Z" fill="url(#leather)"/>
    <!-- legs and boots -->
    <path d="M29 57 L35 57 L35 69 L29 69 Z M37 57 L43 57 L43 69 L37 69 Z" fill="url(#pants)"/>
    <path d="M27 67 L36 67 L36 76 L25 76 C25 72 26 69 27 67 Z" fill="url(#leather)"/>
    <path d="M36 67 L44 67 C46 70 48 73 48 76 L36 76 Z" fill="url(#leather)"/>
    <!-- tunic with a notched hem, belt -->
    <path d="M28 33 C29 31 43 31 44 33 L46 59 L41 57 L36 60 L31 57 L26 59 Z" fill="url(#tunic)"/>
    <path d="M27 47 L45 47 L45.3 50.5 L26.7 50.5 Z" fill="url(#leather)"/>
    <path d="M34 47 L37.5 47 L37.5 50.5 L34 50.5 Z" fill="url(#gold)" stroke-width="0.8"/>
    <!-- longbow in front, near arm gripping it -->
    <path d="M50 74 L50 18" stroke="#f4f0dc" stroke-width="0.8"/>
    <path d="M50 18 C61 28 61 64 50 74" fill="none" stroke="url(#wood)" stroke-width="2.6"/>
    <path d="M39 34 C46 36 50 40 51 45 L46 47 C45 43 42 40 38 38 Z" fill="url(#hood)"/>
    <ellipse cx="52.6" cy="46" rx="2.4" ry="2.2" fill="url(#skin)"/>
    <!-- hood shell behind the head, neck, face -->
    <path d="M18 24 C12 12 20 0 36 0 C47 0 54 6 53 16 L50 22 L30 28 Z" fill="url(#hood)"/>
    <path d="M34 27 L40 27 L40 32 L34 32 Z" fill="url(#skin)"/>
    <path d="M24 16 C24 7 33 3 40 3 C47 4 50 10 49 17 C48 23 45 28 40 30 C35 30 28 27 25 22 Z" fill="url(#skin)"/>
    <!-- red scarf with a tail blowing back -->
    <path d="M31 31 L22 40 L25.5 42 L33 34 Z" fill="url(#scarf)"/>
    <path d="M31 28 C35 31 41 31 45 28 L46 33 C41 36 35 36 30 33 Z" fill="url(#scarf)"/>
    <!-- spiky bangs under the hood rim -->
    <path d="M29 15 C31 9 40 8 46 10 C49 11 50.5 13 50.5 16 L48.6 15 L47 11.5 L45 15 L43 11 L40.8 15 L39 11 C36.5 13 34.5 16 33.5 21 L30 21 Z" fill="url(#hair)"/>
    <path d="M26 14 C26 6 32 2 40 2 C47 2 52 7 52 14 L50 17 C49 11 45 7.5 39 7.5 C33 7.5 30 11 29 16 Z" fill="url(#hood)"/>
  </g>
  </g>
  <!-- eyes and mouth placed pixel by pixel on the 36x45 sprite grid so they stay crisp -->
  <g>
    <rect x="23" y="8" width="3" height="1" fill="#1e1224"/>
    <rect x="19" y="8" width="2" height="1" fill="#1e1224"/>
    <rect x="23" y="9" width="1" height="2" fill="#ffffff"/>
    <rect x="24" y="9" width="2" height="1" fill="#5a2e08"/>
    <rect x="24" y="10" width="1" height="1" fill="#b87020"/>
    <rect x="25" y="10" width="1" height="1" fill="#ffffff"/>
    <rect x="24" y="11" width="2" height="1" fill="#f0b848"/>
    <rect x="20" y="9" width="1" height="1" fill="#5a2e08"/>
    <rect x="20" y="10" width="1" height="1" fill="#b87020"/>
    <rect x="20" y="11" width="1" height="1" fill="#f0b848"/>
    <rect x="23" y="14" width="2" height="1" fill="#b86a58"/>
  </g>
</svg>
