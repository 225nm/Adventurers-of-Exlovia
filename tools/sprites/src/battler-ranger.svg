<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50">
  <!-- Ranger, 3/4 view facing right (flipped in game): green hood and cloak, chestnut bangs, red scarf,
       leather tunic, a quiver of arrows on the back and a longbow held ready.
       Four tones per material in hard-edged bands lit from the upper left, interior lines in a dark shade
       of the material. Drawn at 4 units per pixel, the eyes and mouth are placed pixel by pixel at the end -->
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop offset="0.45" stop-color="#ffe8d4"/><stop offset="0.45" stop-color="#f8c8a8"/><stop offset="0.8" stop-color="#f8c8a8"/><stop offset="0.8" stop-color="#e09a80"/></linearGradient>
    <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#8ae070"/><stop offset="0.3" stop-color="#4aa840"/><stop offset="0.66" stop-color="#4aa840"/><stop offset="0.66" stop-color="#2e7a2e"/></linearGradient>
    <linearGradient id="cloak" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0.4" stop-color="#4aa840"/><stop offset="0.4" stop-color="#2e7a2e"/><stop offset="0.75" stop-color="#2e7a2e"/><stop offset="0.75" stop-color="#1a4a1e"/></linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0.35" stop-color="#e09a5a"/><stop offset="0.35" stop-color="#a85a28"/><stop offset="0.75" stop-color="#a85a28"/><stop offset="0.75" stop-color="#74381a"/></linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop offset="0.35" stop-color="#ff8a6a"/><stop offset="0.35" stop-color="#e04a30"/><stop offset="0.72" stop-color="#e04a30"/><stop offset="0.72" stop-color="#a02a1a"/></linearGradient>
    <linearGradient id="tunic" x1="0" y1="0" x2="1" y2="1"><stop offset="0.3" stop-color="#e8b070"/><stop offset="0.3" stop-color="#b07a44"/><stop offset="0.68" stop-color="#b07a44"/><stop offset="0.68" stop-color="#7a4e26"/></linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#6a7a44"/><stop offset="0.5" stop-color="#46522c"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0.4" stop-color="#a87444"/><stop offset="0.4" stop-color="#7a4a24"/><stop offset="0.75" stop-color="#7a4a24"/><stop offset="0.75" stop-color="#4a2c14"/></linearGradient>
    <linearGradient id="bow" x1="0" y1="0" x2="1" y2="0"><stop offset="0.5" stop-color="#e0a860"/><stop offset="0.5" stop-color="#8a5a28"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0.45" stop-color="#fff0a0"/><stop offset="0.45" stop-color="#d8a838"/></linearGradient>
  </defs>
  <g transform="scale(0.25) translate(0 8)">
  <g stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round">
    <!-- cloak behind -->
    <path d="M68 74 C54 98 46 136 44 176 C58 180 74 180 86 176 L90 80 Z" fill="url(#cloak)" stroke="#123416"/>
    <path d="M60 110 C56 134 54 156 54 174" fill="none" stroke="#1a4a1e" stroke-width="2.4"/>
    <!-- quiver on the back, arrow fletchings over the shoulder -->
    <path d="M52 64 L64 58 L84 120 L72 126 Z" fill="url(#leather)" stroke="#2a1808"/>
    <path d="M50 64 L44 50 L52 54 L50 44 L58 52 L58 42 L64 54 Z" fill="#f4f0e0" stroke="#5a5040" stroke-width="2.4"/>
    <path d="M47 52 L52 60 M55 47 L57 58" fill="none" stroke="#e04a30" stroke-width="2.4"/>
    <!-- legs and boots -->
    <path d="M66 140 L80 140 L80 172 L66 172 Z" fill="url(#pants)" stroke="#262e16"/>
    <path d="M62 168 L82 168 L82 190 L58 190 C58 180 60 174 62 168 Z" fill="url(#leather)" stroke="#2a1808"/>
    <path d="M88 140 L102 140 L104 172 L90 172 Z" fill="url(#pants)" stroke="#262e16"/>
    <path d="M88 168 L106 168 C112 174 118 182 120 190 L88 190 Z" fill="url(#leather)" stroke="#2a1808"/>
    <!-- leather tunic, belt -->
    <path d="M68 82 C68 76 110 76 112 82 L116 146 L104 142 L90 150 L76 142 L62 146 Z" fill="url(#tunic)" stroke="#4a2c14"/>
    <path d="M90 84 L90 140" fill="none" stroke="#7a4e26" stroke-width="2.4"/>
    <path d="M76 96 L80 108 M100 96 L98 108" fill="none" stroke="#f0c890" stroke-width="2.2"/>
    <path d="M64 120 L116 120 L116 130 L64 130 Z" fill="url(#leather)" stroke="#2a1808"/>
    <path d="M84 118 L96 118 L96 132 L84 132 Z" fill="url(#gold)" stroke="#6a4008" stroke-width="2.4"/>
    <!-- quiver strap across the chest -->
    <path d="M72 80 L114 116 L108 122 L68 88 Z" fill="url(#leather)" stroke="#2a1808" stroke-width="2.4"/>
    <!-- longbow held ready in front, string drawn taut -->
    <path d="M126 28 C150 60 152 128 126 168" fill="none" stroke="#2a1808" stroke-width="9"/>
    <path d="M126 28 C150 60 152 128 126 168" fill="none" stroke="url(#bow)" stroke-width="5"/>
    <path d="M126 28 L126 168" fill="none" stroke="#f0f0e0" stroke-width="1.6"/>
    <path d="M140 92 L146 92 L146 104 L140 104 Z" fill="url(#leather)" stroke="#2a1808" stroke-width="2"/>
    <!-- near arm reaching to the bow -->
    <path d="M100 84 C116 88 126 96 138 96 L140 106 C124 108 110 102 100 98 Z" fill="url(#tunic)" stroke="#4a2c14"/>
    <path d="M134 92 C140 88 150 90 150 98 C150 106 142 110 136 106 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <!-- red scarf with a tail blowing back -->
    <path d="M74 72 C84 80 100 80 110 72 L110 86 C100 92 84 92 74 86 Z" fill="url(#scarf)" stroke="#5a1408"/>
    <path d="M76 80 C66 84 58 92 50 92 C56 98 66 98 78 90 Z" fill="url(#scarf)" stroke="#5a1408"/>
    <!-- hood with the face inside -->
    <path d="M64 56 C58 34 70 12 94 8 C112 6 128 18 130 38 C132 52 128 64 120 72 L112 76 L74 76 C68 70 66 64 64 56 Z" fill="url(#hood)" stroke="#123416"/>
    <path d="M64 56 C54 50 46 40 44 28 C54 34 62 36 68 36 Z" fill="url(#hood)" stroke="#123416"/>
    <path d="M78 52 C76 30 88 22 100 22 C114 22 124 32 124 48 C124 60 118 68 106 72 C94 76 84 72 80 64 C78 60 78 56 78 52 Z" fill="url(#skin)" stroke="#9a4a3a"/>
    <!-- chestnut bangs -->
    <path d="M78 44 C80 30 92 22 106 22 C118 24 126 32 126 42 L120 44 L116 34 L110 42 L104 32 L98 42 L92 33 L88 44 C84 48 82 54 82 60 L78 58 Z" fill="url(#hair)" stroke="#4a2008"/>
    <path d="M78 14 C88 10 100 10 110 14" fill="none" stroke="#a8f090" stroke-width="2.6"/>
  </g>
  </g>
  <!-- face on the 40x50 pixel grid: brows, amber eyes with a shine, a small mouth -->
  <g>
    <rect x="21" y="12" width="3" height="1" fill="#74381a"/>
    <rect x="27" y="12" width="2" height="1" fill="#74381a"/>
    <rect x="21" y="13" width="3" height="1" fill="#1e1224"/>
    <rect x="27" y="13" width="2" height="1" fill="#1e1224"/>
    <rect x="21" y="14" width="2" height="1" fill="#5a2e08"/>
    <rect x="23" y="14" width="1" height="2" fill="#ffffff"/>
    <rect x="21" y="15" width="1" height="1" fill="#b06a18"/>
    <rect x="22" y="15" width="1" height="1" fill="#ffffff"/>
    <rect x="21" y="16" width="2" height="1" fill="#e0a030"/>
    <rect x="27" y="14" width="1" height="1" fill="#5a2e08"/>
    <rect x="28" y="14" width="1" height="2" fill="#ffffff"/>
    <rect x="27" y="15" width="1" height="1" fill="#b06a18"/>
    <rect x="27" y="16" width="1" height="1" fill="#e0a030"/>
    <rect x="25" y="18" width="2" height="1" fill="#c06a5a"/>
  </g>
</svg>
