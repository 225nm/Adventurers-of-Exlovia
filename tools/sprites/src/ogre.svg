<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 296">
  <!-- Ogre: a hulking brute hunched forward, small head sunk between huge shoulders, tusks, a fur
       loincloth, iron bracers and a spiked club raised in its fist. Faces right, lit from the upper left -->
  <defs>
    <radialGradient id="skin" cx="0.3" cy="0.22" r="0.9">
      <stop offset="0" stop-color="#ffd4b0"/>
      <stop offset="0.3" stop-color="#e8946c"/>
      <stop offset="0.68" stop-color="#a85640"/>
      <stop offset="1" stop-color="#4a1c18"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#f6b490"/>
      <stop offset="0.45" stop-color="#cc7656"/>
      <stop offset="1" stop-color="#5e2820"/>
    </linearGradient>
    <linearGradient id="limbFar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b0664c"/>
      <stop offset="1" stop-color="#4a1e18"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a70"/>
      <stop offset="0.5" stop-color="#52503c"/>
      <stop offset="1" stop-color="#22221a"/>
    </linearGradient>
    <linearGradient id="iron" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8dce8"/>
      <stop offset="0.45" stop-color="#8a90a4"/>
      <stop offset="1" stop-color="#3a3e50"/>
    </linearGradient>
    <linearGradient id="club" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c49a66"/>
      <stop offset="0.5" stop-color="#7e5a34"/>
      <stop offset="1" stop-color="#3e2a16"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffd0"/>
      <stop offset="0.6" stop-color="#ffc030"/>
      <stop offset="1" stop-color="#d05010"/>
    </radialGradient>
  </defs>
  <g stroke="#1c0e08" stroke-width="3.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- club raised behind the head -->
    <path d="M186 168 L214 70 L228 74 L200 172 Z" fill="url(#club)"/>
    <path d="M206 84 C196 60 200 28 222 12 C244 6 248 34 242 60 C238 74 230 84 220 88 Z" fill="url(#club)"/>
    <path d="M214 30 L204 24 M232 22 L238 12 M240 48 L248 46 M206 54 L196 54 M226 70 L234 78" stroke-width="5"/>
    <path d="M214 30 L206 25 M232 22 L236 14 M240 48 L246 46 M206 54 L198 54 M226 70 L232 76" stroke="#e8ecf4" stroke-width="2"/>
    <path d="M218 22 C210 34 208 52 212 70" fill="none" stroke="#e0bc88" stroke-width="2.6"/>
    <!-- far arm hanging, a heavy fist -->
    <path d="M64 92 C40 104 30 132 28 160 C26 178 28 192 32 202 L56 200 C54 186 54 170 58 156 C62 138 70 124 80 116 Z" fill="url(#limbFar)"/>
    <path d="M24 196 C22 186 34 180 46 182 C58 184 64 194 62 206 C60 218 46 222 36 218 C28 214 24 206 24 196 Z" fill="url(#limbFar)"/>
    <path d="M26 182 L58 178 L60 192 L26 196 Z" fill="url(#iron)"/>
    <!-- far leg -->
    <path d="M78 214 C70 230 64 250 66 270 L52 284 C50 292 92 292 92 286 L88 270 C90 254 96 238 104 224 Z" fill="url(#limbFar)"/>
    <!-- near leg -->
    <path d="M128 216 C142 232 150 252 150 270 L140 284 C138 292 184 292 182 284 L172 270 C172 250 164 228 152 212 Z" fill="url(#limb)"/>
    <path d="M150 248 C156 246 162 248 164 252" fill="none" stroke-width="2.4"/>
    <!-- great hunched body and belly -->
    <path d="M70 84 C82 60 116 50 150 56 C178 62 196 82 196 108 C196 140 186 172 176 196 C164 222 132 232 104 228 C80 224 66 206 62 180 C58 150 58 108 70 84 Z" fill="url(#skin)"/>
    <path d="M96 156 C112 140 150 140 168 154 C172 176 164 200 146 212" fill="none" stroke="#6a2a1c" stroke-width="3" opacity="0.6"/>
    <path d="M104 160 C118 150 140 150 152 156" fill="none" stroke="#ffd8b0" stroke-width="3" opacity="0.7"/>
    <path d="M104 116 C116 108 132 108 142 114 M150 104 C160 100 172 104 178 112" fill="none" stroke-width="2.6"/>
    <path d="M86 92 C96 76 116 68 134 68" fill="none" stroke="#ffe0c0" stroke-width="3" opacity="0.8"/>
    <!-- leather strap across the chest -->
    <path d="M84 78 L182 172 L172 184 L74 92 Z" fill="#5a3a22"/>
    <circle cx="128" cy="126" r="5" fill="url(#iron)"/>
    <!-- fur loincloth -->
    <path d="M70 196 C96 206 140 208 178 194 L184 228 L168 222 L162 238 L148 226 L136 242 L122 228 L108 240 L96 226 L82 236 L78 222 L66 226 Z" fill="url(#fur)"/>
    <path d="M88 210 L92 222 M112 214 L114 228 M140 214 L140 226 M164 206 L166 218" fill="none" stroke-width="2.4"/>
    <g transform="translate(166 64) scale(1.25) translate(-166 -50)">
    <!-- small brutish head sunk between the shoulders -->
    <path d="M134 40 C134 22 150 12 166 14 C184 16 194 30 192 46 C198 50 202 58 198 66 C194 80 182 88 168 88 C150 88 136 76 134 62 C128 60 126 50 134 40 Z" fill="url(#skin)"/>
    <path d="M136 46 C128 40 124 30 128 22 C134 30 140 36 144 40 Z" fill="url(#skin)"/>
    <!-- topknot -->
    <path d="M152 16 C150 6 158 0 166 2 C162 8 164 12 168 14 Z" fill="#2a1a12"/>
    <!-- heavy brow, burning eyes -->
    <path d="M152 40 C160 52 194 52 198 42 L196 58 C186 60 160 60 154 56 Z" fill="#6a2a1c" stroke="none" opacity="0.8"/>
    <path d="M148 34 C162 26 180 26 196 34 L194 44 C180 38 164 38 150 44 Z" fill="#6a2a1c"/>
    <ellipse cx="164" cy="49" rx="7.5" ry="5" fill="url(#eye)"/>
    <ellipse cx="185" cy="48" rx="6" ry="4.6" fill="url(#eye)"/>
    <circle cx="166.5" cy="49.5" r="2.4" fill="#2a0a04" stroke="none"/>
    <circle cx="187" cy="48.5" r="2.1" fill="#2a0a04" stroke="none"/>
    <!-- flat nose, underbite with tusks -->
    <path d="M180 52 C188 54 194 60 192 66 C186 68 180 64 178 60 Z" fill="url(#skin)"/>
    <path d="M160 72 C170 78 186 78 196 70 C194 82 184 86 172 86 C164 84 160 80 160 72 Z" fill="#3a1208"/>
    <path d="M162 78 L156 56 L172 74 Z M188 74 L198 54 L196 76 Z" fill="#fff6e0"/>
    </g>
    <!-- near arm, bracer and fist around the club -->
    <path d="M158 84 C180 88 196 108 198 132 C200 148 196 160 190 168 L170 160 C176 150 178 138 176 126 C174 112 164 102 150 98 Z" fill="url(#limb)"/>
    <path d="M168 146 L196 152 L192 170 L164 162 Z" fill="url(#iron)"/>
    <path d="M176 164 C178 154 192 150 202 156 C212 162 212 176 204 184 C196 190 182 188 178 180 C174 176 174 170 176 164 Z" fill="url(#limb)"/>
    <path d="M186 160 L200 166 M184 168 L202 174 M186 176 L198 180" fill="none" stroke-width="2.4"/>
  </g>
</svg>
